name: Build app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-bundles:
    name: Web and Android bundles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Check Expo project configuration
        run: npx expo-doctor

      - name: Build web app
        run: npm run web:build

      - name: Bundle Android app
        run: npm run android:bundle
